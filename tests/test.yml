---
# Prueba del role contra máquinas reales: una RedHat y una Debian.
#
# Cubre los tres caminos que tiene el role:
#   - tree: repositorios oficiales, sin versión.
#   - gh:   repositorio propio con clave y versión mínima. Su clave apt es
#           binaria (.gpg) y la de rpm es texto (.asc): prueba también que la
#           clave se guarda con la extensión que apt necesita.
#   - argumentos: que un operador mal escrito se rechaza antes de empezar.
#
# Se lanza dos veces. La segunda tiene que terminar sin ningún «changed».
- name:                 Probar el role instalacion_paquetes
  hosts:                all
  gather_facts:         false

  vars:
    repos_gh:
      redhat:
        repositorio:    https://cli.github.com/packages/rpm
        clave:          https://cli.github.com/packages/githubcli-archive-keyring.asc
      debian:
        repositorio:    https://cli.github.com/packages
        clave:          https://cli.github.com/packages/githubcli-archive-keyring.gpg
        suite:          stable

  tasks:
    - name:             Instalar tree de los repositorios oficiales
      ansible.builtin.include_role:  # noqa: var-naming[no-role-prefix]
        name:           instalacion_paquetes
      vars:
        paquete:        tree

    - name:             Instalar gh 2.0 o superior desde el repositorio de GitHub
      ansible.builtin.include_role:  # noqa: var-naming[no-role-prefix]
        name:           instalacion_paquetes
      vars:
        paquete:        gh
        version:        "2.0"
        operador_version: ">="
        repositorio:    "{{ repos_gh[ansible_facts.os_family | lower].repositorio }}"
        clave:          "{{ repos_gh[ansible_facts.os_family | lower].clave }}"
        suite:          "{{ repos_gh[ansible_facts.os_family | lower].suite | default('') }}"

    - name:             Comprobar que gh funciona
      ansible.builtin.command:
        cmd:            gh --version
      register:         gh_version
      changed_when:     false

    - name:             Comprobar que un operador mal escrito se rechaza
      block:
        - name:         Llamar al role con «=>»
          ansible.builtin.include_role:  # noqa: var-naming[no-role-prefix]
            name:       instalacion_paquetes
          vars:
            paquete:    tree
            version:    "1.0"
            operador_version: "=>"
        - name:         Si llega aquí, la validación no ha funcionado
          ansible.builtin.fail:
            msg:        "El role aceptó «=>» como operador"
      rescue:
        - name:         Confirmar que el fallo es el de la validación de argumentos
          ansible.builtin.assert:
            that:
              - "'operador_version' in ansible_failed_result.msg"
            quiet:      true

    - name:             Resultado
      ansible.builtin.debug:
        msg:            "{{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}: {{ gh_version.stdout_lines[0] }}"
